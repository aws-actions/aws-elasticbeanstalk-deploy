name: Deploy to Elastic Beanstalk - Beanstalk Cluster Environment (Build From Source)

# Lets Elastic Beanstalk containerize the source for you. The action packages the
# repository, uploads it to S3, starts a CodeBuild image build, and waits for the
# build to finish before deploying.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  APPLICATION_NAME: cluster-app
  ENVIRONMENT_NAME: cluster-app-env

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          application-name: ${{ env.APPLICATION_NAME }}
          environment-name: ${{ env.ENVIRONMENT_NAME }}
          version-label: cluster-${{ github.sha }}
          exclude-patterns: '*.git*,*node_modules*'
          build-configuration: |
            {
              "Type": "docker",
              "DockerfileLocation": "Dockerfile",
              "CodeBuildServiceRole": "${{ secrets.CODEBUILD_ROLE_ARN }}"
            }
          option-settings: |
            [
              {
                "Namespace": "aws:elasticbeanstalk:eks",
                "OptionName": "cluster-role",
                "Value": "${{ secrets.CLUSTER_ROLE_ARN }}"
              },
              {
                "Namespace": "aws:elasticbeanstalk:eks",
                "OptionName": "node-role",
                "Value": "${{ secrets.NODE_ROLE_ARN }}"
              },
              {
                "Namespace": "aws:elasticbeanstalk:eks:environment",
                "OptionName": "observability-role",
                "Value": "${{ secrets.OBSERVABILITY_ROLE_ARN }}"
              }
            ]
