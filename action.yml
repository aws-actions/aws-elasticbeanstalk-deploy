name: 'Deploy to AWS Elastic Beanstalk'
description: 'This action deploys to AWS Elastic Beanstalk with auto-creation and retries'
author: 'AWS Elastic Beanstalk'

inputs:
  aws-region:
    description: 'AWS Region'
    required: true
  application-name:
    description: 'Elastic Beanstalk Application Name'
    required: true
  environment-name:
    description: 'Elastic Beanstalk Environment Name'
    required: true
  version-label:
    description: 'Version label for deployment (defaults to git SHA)'
    required: false
  deployment-package-path:
    description: 'Path to existing deployment package (auto-created if not specified)'
    required: false
  solution-stack-name:
    description: 'Solution stack name (e.g., "64bit Amazon Linux 2023 v4.3.0 running Python 3.11", "64bit Amazon Linux 2023 v6.3.1 running Node.js 20"). Cannot be used with platform-arn.'
    required: false
  platform-arn:
    description: 'Platform ARN for the environment (e.g., "arn:aws:elasticbeanstalk:us-east-1::platform/Python 3.11 running on 64bit Amazon Linux 2023/4.3.0"). Cannot be used with solution-stack-name.'
    required: false
  create-environment-if-not-exists:
    description: 'Create environment if it does not exist'
    required: false
    default: 'true'
  create-application-if-not-exists:
    description: 'Create application if it does not exist'
    required: false
    default: 'true'
  wait-for-deployment:
    description: 'Wait for deployment to complete'
    required: false
    default: 'true'
  wait-for-environment-recovery:
    description: 'Wait for environment health to recover after deployment'
    required: false
    default: 'true'
  deployment-timeout:
    description: 'Maximum time to wait for each wait phase (seconds): waiting for an existing environment to become Ready, the deployment (wait-for-deployment), and health recovery (wait-for-environment-recovery). With both waits enabled the total maximum wait is 3× this value. Defaults to 900, or 2400 when image-uri or build-configuration is set (the first Beanstalk Cluster environment in an account provisions an EKS cluster, which takes 15-20 minutes).'
    required: false
  max-retries:
    description: 'Maximum number of retries for failed operations'
    required: false
    default: '2'
  retry-delay:
    description: 'Initial delay between retries (seconds, uses exponential backoff)'
    required: false
    default: '5'
  use-existing-application-version-if-available:
    description: 'Reuse existing application version if it already exists'
    required: false
    default: 'true'
  create-s3-bucket-if-not-exists:
    description: 'Create S3 bucket if it does not exist'
    required: false
    default: 'true'
  s3-bucket-name:
    description: 'S3 bucket name for deployment packages (defaults to elasticbeanstalk-{region}-{accountId})'
    required: false
  cname-prefix:
    description: 'CNAME prefix for the environment URL (e.g. my-app → my-app.elasticbeanstalk.com). Must be 4–63 alphanumeric characters or hyphens. If omitted, AWS auto-assigns one. Only used when creating a new environment.'
    required: false
  source-directory:
    description: 'Directory to package for deployment (defaults to workspace root). Useful for mono-repos where only a subdirectory should be deployed.'
    required: false
  exclude-patterns:
    description: 'Comma-separated list of patterns to exclude from deployment package (e.g., "*.git*,*node_modules*,*.env*")'
    required: false
  symlinks:
    description: 'How to handle symlinks when packaging: "preserve" stores them as symlink entries in the zip (matches EB CLI, default); "follow" inlines the target file contents for symlinks that resolve inside the source directory (external symlinks are skipped). Ignored when deployment-package-path is set.'
    required: false
    default: 'preserve'
  option-settings:
    description: 'Elastic Beanstalk option settings as JSON array. Required when creating a new environment. Beanstalk Standard MUST include IAM settings: [{"Namespace":"aws:autoscaling:launchconfiguration","OptionName":"IamInstanceProfile","Value":"your-instance-profile"},{"Namespace":"aws:elasticbeanstalk:environment","OptionName":"ServiceRole","Value":"your-service-role"}]. Beanstalk Cluster MUST instead include: [{"Namespace":"aws:elasticbeanstalk:eks","OptionName":"cluster-role","Value":"your-cluster-role-arn"},{"Namespace":"aws:elasticbeanstalk:eks","OptionName":"node-role","Value":"your-node-role-arn"},{"Namespace":"aws:elasticbeanstalk:eks:environment","OptionName":"observability-role","Value":"your-observability-role-arn"}]'
    required: false
  image-uri:
    description: 'Pre-built container image URI for Beanstalk Cluster BYOI (e.g., 123456789.dkr.ecr.us-west-2.amazonaws.com/my-app:v1). When set, the action creates a Beanstalk Cluster environment, skips packaging/S3 upload, and creates the application version with ImageSource. Mutually exclusive with build-configuration.'
    required: false
  build-configuration:
    description: 'JSON object for Beanstalk Cluster auto-containerization (build from source): the Build settings, e.g. {"Type":"docker","CodeBuildServiceRole":"arn:..."}. When set, the action creates a Beanstalk Cluster environment and triggers a CodeBuild image build. Mutually exclusive with image-uri.'
    required: false
  mask-resource-identifiers:
    description: 'When true, infrastructure identifiers (account ID, bucket names, application/environment names, version labels, environment URL/ID, image URIs) are masked as *** in the log, Elastic Beanstalk event details are suppressed, and error messages are stripped of AWS resource IDs. Default false: logs are unchanged. Masking is job-wide and matches substrings, so it also applies to later steps in the job and a short value (for example an environment named prod) will hide that text inside other words; the action warns when a masked value is shorter than 8 characters. A version label equal to the commit SHA (the default when version-label is unset) is never masked. Action outputs are always set and remain readable by later steps in the same job, but GitHub does not forward masked values as job-level outputs to other jobs.'
    required: false
    default: 'false'

outputs:
  environment-url:
    description: 'The URL of the deployed environment'
  environment-id:
    description: 'The ID of the environment'
  environment-status:
    description: 'The current status of the environment'
  environment-health:
    description: 'The health status of the environment'
  deployment-action-type:
    description: 'Whether environment was created or updated'
  version-label:
    description: 'The version label that was deployed'

runs:
  using: 'node24'
  main: 'dist/index.js'
